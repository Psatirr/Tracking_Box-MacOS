name: Build macOS bundle

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Ambil kode kamu
        uses: actions/checkout@v4

      - name: Ambil Resolume FFGL SDK
        run: |
          git clone https://github.com/resolume/ffgl.git sdk
          git -C sdk checkout 5b6e07840277df9ec35a228b9eb067636316350f

      - name: Compile (universal arm64 + x86_64)
        run: |
          set -e
          mkdir -p build/TrackingBox.bundle/Contents/MacOS
          clang++ -bundle -std=c++17 -O2 \
            -arch arm64 -arch x86_64 -mmacosx-version-min=10.15 \
            -DTARGET_OS_MAC=1 -DNDEBUG \
            -I sdk/source/lib -I . \
            sdk/source/lib/ffgl/*.cpp sdk/source/lib/ffglex/*.cpp TrackingBox.cpp \
            -framework OpenGL -framework Carbon -framework AppKit \
            -framework CoreText -framework CoreGraphics -framework CoreFoundation \
            -o build/TrackingBox.bundle/Contents/MacOS/TrackingBox

      - name: Buat Info.plist
        run: |
          cat > build/TrackingBox.bundle/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>English</string>
            <key>CFBundleExecutable</key><string>TrackingBox</string>
            <key>CFBundleIdentifier</key><string>com.trackingbox.ffgl</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>TrackingBox</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleSignature</key><string>????</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CSResourcesFileMapped</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Cek hasil
        run: |
          lipo -info build/TrackingBox.bundle/Contents/MacOS/TrackingBox
          nm -gU build/TrackingBox.bundle/Contents/MacOS/TrackingBox | grep _plugMain
          plutil -lint build/TrackingBox.bundle/Contents/Info.plist

      - name: Tanda tangan ad-hoc
        run: codesign --force --deep --sign - build/TrackingBox.bundle

      - name: Bungkus zip
        run: ditto -c -k --keepParent build/TrackingBox.bundle TrackingBox-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrackingBox-mac
          path: TrackingBox-mac.zip
